name: Deploy Ongil to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          for file in assets/js/*.js; do
            node --check "$file"
          done

      - name: Validate ten service panels
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          services = ['fortune','analysis','lotto','tarot','date','naming','compatibility','dream','jibang','chukmun']
          for service in services:
              assert html.count(f'data-panel="{service}"') == 1, f'{service} panel must exist exactly once'
              assert f'data-service="{service}"' in html, f'{service} button missing'
          assert 'data-panel="face"' not in html, 'unexpected face panel'
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
