name: Deploy Ongil to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Ongil theme
        run: python scripts/build_theme.py

      - name: Build original Ongil main landing
        run: python scripts/build_main_landing.py

      - name: Remove memorial rite from date selection
        run: python scripts/build_date_options.py

      - name: Build mobile AI face reading
        run: python scripts/build_face_ai.py

      - name: Build visual tarot cards
        run: python scripts/build_tarot_cards.py

      - name: Build daily lotto recommendation
        run: python scripts/build_lotto.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
